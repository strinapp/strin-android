name: Build Android bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap "$ANDROID_HOME/tools"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
      - name: Install Android components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.1.0" "platforms;android-36" "platform-tools"
      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > android.keystore
      - name: Generate Android project
        run: printf '1.0.0\n' | bubblewrap update
      - name: Build unsigned bundle
        run: ./gradlew :app:bundleRelease --console=plain
      - name: Sign bundle
        env:
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          "$JAVA_HOME/bin/jarsigner" -sigalg SHA256withRSA -digestalg SHA-256 -keystore android.keystore -storepass "$KS_PW" -keypass "$KS_PW" app/build/outputs/bundle/release/app-release.aab strin
          mv app/build/outputs/bundle/release/app-release.aab strin-1.0.0.aab
      - name: Publish release with the bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete strin-1.0.0 --yes 2>/dev/null || true
          gh release create strin-1.0.0 strin-1.0.0.aab --title "STRin Android 1.0.0" --notes "Signed Android App Bundle for com.strin.app (internal testing)."
